# ===================
# Application
# ===================
spring.application.name=CorpusLab
server.port=8080
spring.config.import=optional:file:../.env[.properties]

# ===================
# PostgreSQL
# ===================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:corpuslab_db}?reWriteBatchedInserts=true
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000

# ===================
# JPA / Hibernate
# ===================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================
# Cache
# ===================
spring.cache.type=redis

# ===================
# Redis
# ===================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===================
# Observability
# ===================
management.server.port=${MANAGEMENT_PORT:${server.port}}
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoint.metrics.access=read-only
management.endpoint.prometheus.access=read-only
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# ===================
# Docker Compose
# ===================
spring.docker.compose.file=../docker-compose.yml

# ===================
# Mail (SMTP)
# ===================
app.mail.from=${APP_MAIL_FROM}
app.email.retry.max-attempts=5
app.email.retry.base-backoff-ms=30000
app.email.retry.max-backoff-ms=900000
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST}
spring.mail.properties.mail.debug=${MAIL_DEBUG}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================
# OAuth2 Login
# ===================
app.oauth2.success-redirect-url=${APP_OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:5173/oauth2/redirect}
app.oauth2.failure-redirect-url=${APP_OAUTH2_FAILURE_REDIRECT_URL:http://localhost:5173/auth/login}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email

# ===================
# JWT
# ===================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600
app.auth.password-reset-token-expiration-minutes=15
app.security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}

# ===================
# Auth Rate Limiting
# ===================
app.rate-limit.auth.login.ip.max-attempts=100
app.rate-limit.auth.login.ip.window-seconds=900
app.rate-limit.auth.login.email.max-attempts=10
app.rate-limit.auth.login.email.window-seconds=900
app.rate-limit.auth.forgot-password.ip.max-attempts=30
app.rate-limit.auth.forgot-password.ip.window-seconds=900
app.rate-limit.auth.forgot-password.email.max-attempts=3
app.rate-limit.auth.forgot-password.email.window-seconds=900
app.rate-limit.auth.reset-password.ip.max-attempts=60
app.rate-limit.auth.reset-password.ip.window-seconds=900
app.rate-limit.auth.reset-password.token.max-attempts=10
app.rate-limit.auth.reset-password.token.window-seconds=900

# ===================
# Multipart
# ===================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.dataset.max-stored-file-size-bytes=10485760
app.dataset-upload.status-ttl-seconds=86400
app.dataset-upload.staging-cleanup-max-age-hours=24
app.dataset-upload.staging-cleanup-delay-ms=3600000
app.guideline.max-pdf-size-bytes=10485760
app.project.wizard-cleanup-window-minutes=30

