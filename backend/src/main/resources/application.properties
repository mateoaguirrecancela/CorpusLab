# ===================
# Application
# ===================
spring.application.name=CorpusLab
server.port=8080
spring.config.import=optional:file:.env[.properties]

# ===================
# PostgreSQL
# ===================
spring.datasource.url=jdbc:postgresql://localhost:5432/corpuslab_db?reWriteBatchedInserts=true
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000

# ===================
# JPA / Hibernate
# ===================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================
# Cache
# ===================
spring.cache.type=redis

# ===================
# Redis
# ===================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===================
# Docker Compose
# ===================
spring.docker.compose.file=../docker-compose.yaml

# ===================
# Mail (SMTP)
# ===================
app.mail.from=${APP_MAIL_FROM}
app.email.retry.max-attempts=5
app.email.retry.base-backoff-ms=30000
app.email.retry.max-backoff-ms=900000
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST}
spring.mail.properties.mail.debug=${MAIL_DEBUG}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================
# OAuth2 Login
# ===================
app.oauth2.success-redirect-url=http://localhost:5173/oauth2/redirect
app.oauth2.failure-redirect-url=http://localhost:5173/auth/login
app.frontend.base-url=http://localhost:5173

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email

# ===================
# JWT
# ===================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600
app.auth.password-reset-token-expiration-minutes=15

# ===================
# Auth Rate Limiting
# ===================
app.rate-limit.auth.login.ip.max-attempts=100
app.rate-limit.auth.login.ip.window-seconds=900
app.rate-limit.auth.login.email.max-attempts=10
app.rate-limit.auth.login.email.window-seconds=900
app.rate-limit.auth.forgot-password.ip.max-attempts=30
app.rate-limit.auth.forgot-password.ip.window-seconds=900
app.rate-limit.auth.forgot-password.email.max-attempts=3
app.rate-limit.auth.forgot-password.email.window-seconds=900
app.rate-limit.auth.reset-password.ip.max-attempts=60
app.rate-limit.auth.reset-password.ip.window-seconds=900
app.rate-limit.auth.reset-password.token.max-attempts=10
app.rate-limit.auth.reset-password.token.window-seconds=900

# ===================
# Multipart
# ===================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.dataset.max-stored-file-size-bytes=10485760
app.dataset-upload.status-ttl-seconds=86400
app.dataset-upload.staging-cleanup-max-age-hours=24
app.dataset-upload.staging-cleanup-delay-ms=3600000
app.guideline.max-pdf-size-bytes=10485760
app.project.wizard-cleanup-window-minutes=30

