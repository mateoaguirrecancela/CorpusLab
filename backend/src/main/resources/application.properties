# ===================
# Application
# ===================
spring.application.name=CorpusLab
server.port=8080
spring.config.import=optional:file:.env[.properties]

# ===================
# PostgreSQL
# ===================
spring.datasource.url=jdbc:postgresql://localhost:5432/corpuslab_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================
# JPA / Hibernate
# ===================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===================
# Redis
# ===================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===================
# Docker Compose
# ===================
spring.docker.compose.file=../docker-compose.yaml

# ===================
# Mail (SMTP)
# ===================
app.mail.from=${APP_MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:}
spring.mail.properties.mail.debug=${MAIL_DEBUG:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
