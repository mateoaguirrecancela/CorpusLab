app.frontend.base-url=http://localhost:5173

spring.docker.compose.enabled=false

app.jwt.secret=test-secret-with-at-least-32-bytes-123456

spring.datasource.url=jdbc:tc:postgresql:16-alpine:///corpuslab_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=create-drop

app.oauth2.success-redirect-url=http://localhost:5173/oauth2/redirect
app.oauth2.failure-redirect-url=http://localhost:5173/auth/login
app.security.trust-forwarded-headers=false

spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test
spring.security.oauth2.client.registration.github.client-id=test
spring.security.oauth2.client.registration.github.client-secret=test

app.rate-limit.auth.login.ip.max-attempts=0
app.rate-limit.auth.login.email.max-attempts=0
app.rate-limit.auth.forgot-password.ip.max-attempts=0
app.rate-limit.auth.forgot-password.email.max-attempts=0
app.rate-limit.auth.reset-password.ip.max-attempts=0
app.rate-limit.auth.reset-password.token.max-attempts=0

app.mail.from=test@example.com
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.trust=localhost
spring.mail.properties.mail.debug=false

