# ===================
# PostgreSQL
# ===================
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///corpuslab_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# ===================
# JPA / Hibernate
# ===================
spring.jpa.hibernate.ddl-auto=create-drop

# Keep integration tests deterministic; AuthRateLimiterTest overrides these values.
app.rate-limit.auth.login.ip.max-attempts=0
app.rate-limit.auth.login.email.max-attempts=0
app.rate-limit.auth.forgot-password.ip.max-attempts=0
app.rate-limit.auth.forgot-password.email.max-attempts=0
app.rate-limit.auth.reset-password.ip.max-attempts=0
app.rate-limit.auth.reset-password.token.max-attempts=0
