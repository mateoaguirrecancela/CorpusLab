services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: 'corpuslab-db'
    environment:
      - 'POSTGRES_DB=corpuslab_db'
      - 'POSTGRES_USER=user'
      - 'POSTGRES_PASSWORD=password'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    networks:
      - corpuslab-net
  redis:
    image: 'redis:7-alpine'
    container_name: 'corpuslab-cache'
    ports:
      - '6379:6379'
    networks:
      - corpuslab-net

volumes:
  postgres-data:
    name: 'postgres-data'

networks:
  corpuslab-net:
    name: 'corpuslab-net'
    driver: 'bridge'
